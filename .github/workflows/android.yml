# Builds an installable Android APK in the cloud (no Rust or Android tools needed on your computer).
# GitHub repo -> Actions tab -> "Build Android APK" -> Run workflow. When it finishes (30-60 min the
# first time), download "Image3DHouse-apk" from the bottom of the run page and unzip it.
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      # The APK has to be signed to install. This makes a throw-away key just for this build.
      - name: Make a signing key
        run: >
          keytool -genkey -v -keystore "$RUNNER_TEMP/release.keystore" -alias image3d
          -keyalg RSA -keysize 2048 -validity 10000
          -storepass android -keypass android -dname "CN=Image3DHouse"

      # The game targets Android 13 (API 33); the GitHub computers only have newer ones installed.
      - name: Install the Android platform the game targets
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33"

      - name: Build the APK
        env:
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: android
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          cargo apk build --lib --release

      - uses: actions/upload-artifact@v4
        with:
          name: Image3DHouse-apk
          path: target/release/apk/*.apk
