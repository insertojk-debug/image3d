[package]
name = "image3d_house"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.14"
bevy_rapier3d = "0.27"
image = "0.25"

# In a browser (WebAssembly) rapier needs its wasm-bindgen support, and getrandom must use JS.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_rapier3d = { version = "0.27", features = ["wasm-bindgen"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

# `rlib` is for the desktop binary and the benchmarks, `cdylib` is what Android loads.
[lib]
crate-type = ["rlib", "cdylib"]

# `cargo bench` runs Criterion (benches/core.rs); Criterion supplies its own main().
[[bench]]
name = "core"
harness = false

# --- Android (cargo-apk): `cargo apk run --lib` ---
[package.metadata.android]
package = "org.image3d.house"
apk_name = "Image3DHouse"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 33

[package.metadata.android.application.activity]
orientation = "landscape"

# Faster physics/rendering while developing
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3